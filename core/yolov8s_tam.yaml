# YOLOv8s + TAM 自定义结构（示例骨架）
# 说明：Ultralytics 通过该 yaml 构建网络。要让 TAM 生效，需先把
# core/modules/type_attention.py 中的 TypeAwareAttention 注册到
# ultralytics.nn.modules（见 README「自定义模块接入」），并在下方
# Neck 输出到 head 的位置插入 TAM 层。
nc: 3
scales:
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]

backbone:
  # 与官方 yolov8s.yaml 保持一致
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  # 在三个检测尺度送入 Detect 前各插入一个 TAM（需先完成模块注册）
  - [[15, 18, 21], 1, TypeAwareAttention, []]
  - [[22], 1, Detect, [nc]]
